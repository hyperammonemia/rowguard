name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate parser, rules, provenance, and CLI behavior
        run: python -m unittest discover -s tests -v
      - name: Reproduce the independent synthetic example
        run: python build_demo.py --check
      - name: Verify the published results and original sources
        run: python -m rowguard_verify docs --input data/orders.csv --rules data/rules.json
      - name: Install the local package and test the console entry point
        run: |
          python -m pip install .
          cd /tmp
          rowguard --version
          rowguard-verify "$GITHUB_WORKSPACE/docs" --input "$GITHUB_WORKSPACE/data/orders.csv" --rules "$GITHUB_WORKSPACE/data/rules.json"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check the offline report and preview export
        run: npm run test:ui
